name: Build and Deploy Linux Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux-app:
    name: Build Linux Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux Desktop Application
        run: npm run build:linux

      - name: Deploy Linux Updates via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./dist-electron/
          server-dir: /public/updates/
