name: Build and Deploy Linux Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux-app:
    name: Build Linux Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-increment build version on push
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            const parts = pkg.version.split('.');
            const major = parts[0] || '1';
            const minor = parts[1] || '5';
            pkg.version = \`\${major}.\${minor}.\${process.env.GITHUB_RUN_NUMBER || '0'}\`;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('[Auto Version] Set package.json version to:', pkg.version);
          "

      - name: Build Linux Desktop Application
        run: npm run build:linux

      - name: Validate Linux Build Output
        run: |
          if [ ! -d "./dist-electron/Linux" ]; then
            echo "Error: Linux build output directory ./dist-electron/Linux does not exist!"
            exit 1
          fi
          ls -lh ./dist-electron/Linux

      - name: Deploy Linux Updates via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          log-level: verbose
          local-dir: ./dist-electron/
          server-dir: /public/updates/
