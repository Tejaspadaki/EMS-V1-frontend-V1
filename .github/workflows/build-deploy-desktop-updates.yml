name: Build and Deploy Frontend Desktop App Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-frontend:
    name: Build & Deploy Desktop App Updates via FTP
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Desktop Application
        run: npm run electron:build

      - name: Verify build artifacts output
        run: dir dist-electron

      - name: Validate Executable & latest.yml Integrity
        run: node scripts/verify-exe.cjs

      - name: Deploy Desktop App Updates via FTP
        if: secrets.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist-electron/
          server-dir: /public/updates/
