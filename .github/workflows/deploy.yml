name: Build and Deploy Cross-Platform Desktop App Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop-app:
    name: Build Desktop App (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            build_cmd: npm run build:win
          - os: ubuntu-latest
            target: linux
            build_cmd: npm run build:linux
          - os: macos-latest
            target: mac
            build_cmd: npm run build:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Application for ${{ matrix.target }}
        run: ${{ matrix.build_cmd }}

      - name: Deploy Desktop App Updates via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          timeout: 1200000
          local-dir: ./dist-electron/
          server-dir: /public/updates/
