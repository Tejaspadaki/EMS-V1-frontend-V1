name: Novynth Workflow Frontend & Desktop Updates Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy Web Application and Desktop Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies for Linux Electron Builder & Wine for Windows
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libopenjp2-7-dev libssl-dev rpm wine64 wine

      - name: Install Dependencies & Set Executable Permissions
        run: |
          npm ci
          chmod -R +x node_modules/7zip-bin/ || true
          chmod -R +x node_modules/.bin/ || true

      - name: Build Web Application & Publish Desktop Application to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:publish

      - name: Deploy Web Application to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            **/node_modules/**
            .github/**
            .env*
            README.md