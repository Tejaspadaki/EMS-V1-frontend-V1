name: Build and Deploy Windows Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Desktop Application
        run: npm run build:win

      - name: Validate Windows Build Output
        shell: pwsh
        run: |
          if (-not (Test-Path "./dist-electron/Windows")) {
            Write-Error "Windows build output directory ./dist-electron/Windows does not exist!"
            exit 1
          }
          Get-ChildItem -Path "./dist-electron/Windows" -Recurse | Select-Name, Length

      - name: Deploy Windows Updates via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./dist-electron/Windows/
          server-dir: /public/updates/Windows/
