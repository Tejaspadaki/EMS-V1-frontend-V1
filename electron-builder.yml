appId: com.novynthlabs.novynthworkflow
productName: Novynth Workflow
copyright: Copyright © 2026 Novynth Labs Pvt Ltd

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

publish:
  provider: generic
  url: https://ems-backend.yuktiyantra.com/updates/

extraMetadata:
  author:
    name: Novynth Labs Pvt Ltd
    email: novynthlabs@gmail.com
  companyName: Novynth Labs Pvt Ltd
  maintainer: Novynth Labs Pvt Ltd <novynthlabs@gmail.com>

win:
  executableName: novynth-workflow
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Novynth Workflow"
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
  # Note: only portable-specific schema keys are allowed here (artifactName, guid, publish,
  # requestExecutionLevel, splashImage, unicode, unpackDirName, useZip, warningsAsErrors).
  # Other packaging targets (AppImage, deb) are configured in their respective sections below.

appImage:
  artifactName: "${productName}-${version}.${ext}"

deb:
  artifactName: "${productName}_${version}_amd64.${ext}"

