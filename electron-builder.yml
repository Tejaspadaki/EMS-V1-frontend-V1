appId: com.ems.desktop
productName: Employee Management System
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
publish:
  provider: generic
  url: https://ems-backend.yuktiyantra.com/updates/

win:
  executableName: ems-frontend
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Employee Management System"
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

linux:
  executableName: ems-frontend
  icon: build/icon.png
  category: Utility
  synopsis: Employee Management System Desktop Application
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

appImage:
  artifactName: "${productName}-${version}.${ext}"

deb:
  artifactName: "${productName}_${version}_amd64.${ext}"

rpm:
  artifactName: "${productName}-${version}.x86_64.${ext}"

mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
    - target: pkg
      arch:
        - x64
        - arm64

dmg:
  artifactName: "${productName}-${version}.${ext}"

pkg:
  artifactName: "${productName}-${version}.${ext}"
