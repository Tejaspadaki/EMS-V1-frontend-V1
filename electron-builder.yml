appId: com.ems.desktop
productName: Employee Management System
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - package.json
publish:
  provider: generic
  url: https://ems-backend.yuktiyantra.com/updates/
win:
  cscLink: null
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Employee Management System"
  runAfterFinish: true
