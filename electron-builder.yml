appId: com.novynthlabs.ems
productName: Employee Management System
copyright: Copyright © 2026 Novynth Labs Pvt Ltd

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

publish:
  provider: generic
  url: https://ems-backend.yuktiyantra.com/updates/

extraMetadata:
  author:
    name: Novynth Labs Pvt Ltd
    email: novynthlabs@gmail.com
  companyName: Novynth Labs Pvt Ltd
  maintainer: Novynth Labs Pvt Ltd <novynthlabs@gmail.com>

win:
  executableName: ems-frontend
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Employee Management System"
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

linux:
  executableName: ems-frontend
  icon: build/icon.png
  category: Office
  maintainer: "Novynth Labs Pvt Ltd <novynthlabs@gmail.com>"
  synopsis: Employee Management System Desktop Application
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: "${productName}-${version}.${ext}"

deb:
  artifactName: "${productName}_${version}_amd64.${ext}"

