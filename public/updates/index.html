<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download EMS Desktop App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.25);
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }

        .icon-wrapper svg {
            width: 44px;
            height: 44px;
            stroke: #ffffff;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(129, 140, 248, 0.3);
            color: #c7d2fe;
            border-radius: 9999px;
            font-size: 0.825rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }

        p.description {
            color: #94a3b8;
            font-size: 0.975rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.1rem 2rem;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0.85rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
        }

        .btn-download svg {
            width: 22px;
            height: 22px;
        }

        .meta-info {
            margin-top: 1.75rem;
            font-size: 0.825rem;
            color: #64748b;
            display: flex;
            justify-content: center;
            gap: 1.25rem;
        }

        .meta-info span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .meta-info svg {
            width: 14px;
            height: 14px;
            stroke: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0v.917c0 .496-.407.897-.91.897H3.91C3.407 7.064 3 6.663 3 6.167V5.25" />
            </svg>
        </div>
        
        <div class="badge" id="versionBadge">Desktop App v1.16.0</div>

        <h1>Employee Management System</h1>
        <p class="description">
            Download the official EMS Desktop Application for Windows. Automatic updates and background sync included.
        </p>

        <a href="/updates/download/windows" id="downloadBtn" class="btn-download" download>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            <span id="btnText">Download for Windows (.exe)</span>
        </a>

        <div class="meta-info">
            <span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Windows 10 / 11 (64-bit)
            </span>
            <span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
                Secure & Verified
            </span>
        </div>
    </div>

    <script>
        async function initDownloadPortal() {
            try {
                const res = await fetch('/updates/latest.yml');
                if (res.ok) {
                    const text = await res.text();
                    const versionMatch = text.match(/version:\s*(.+)/);
                    const pathMatch = text.match(/path:\s*(.+)/);
                    
                    if (versionMatch && versionMatch[1]) {
                        const version = versionMatch[1].trim();
                        document.getElementById('versionBadge').textContent = 'Version v' + version;
                    }
                    if (pathMatch && pathMatch[1]) {
                        const exePath = pathMatch[1].trim();
                        document.getElementById('downloadBtn').href = exePath;
                    }
                    return;
                }
            } catch (e) {}

            try {
                const ghRes = await fetch('https://api.github.com/repos/Tejaspadaki/EMS-V1-frontend-V1/releases/latest');
                if (ghRes.ok) {
                    const data = await ghRes.json();
                    const tagName = data.tag_name || 'v1.16.0';
                    document.getElementById('versionBadge').textContent = 'Version ' + tagName;
                    const winAsset = (data.assets || []).find(a => a.name.endsWith('.exe'));
                    if (winAsset && winAsset.browser_download_url) {
                        document.getElementById('downloadBtn').href = winAsset.browser_download_url;
                    }
                }
            } catch (e) {}
        }
        initDownloadPortal();
    </script>
</body>
</html>
